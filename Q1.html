<!DOCTYPE html>
<html lang="en">
<head>
    <title>palindrom number checker</title>
</head>
<body>
    
    <script>
function palindrom(x){
    let temp=x;
     let rem ;
     let digit =0;
     while(x>0){
        rem=x%10;
        digit=(digit*10)+rem;
        x= Math.floor(x/10);

     }
     if(digit==temp){
        return 1;
     }
     else{
        return 0;
     }
    }
let a=(Number(prompt("enter the value")));
 let y=palindrom(a);
 if(y==1){
    alert("this is palindrom number " + a);
    console.log("this is palindrom number " + a);;
 }
 else{
    alert("this is  not palindrom number " + a);
    console.log("this is  not palindrom number " + a);
 }
    </script>
</body>
</html>
